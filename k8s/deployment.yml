apiVersion: apps/v1
kind: Deployment

metadata:
  name: devops-api
  namespace: devops-lab

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: devops-api

  template:
    metadata:
      labels:
        app: devops-api

    spec:
      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: devops-api
          image: ghcr.io/joaohlemes/devops-api:latest
          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: devops-api-config
            - secretRef:
                name: devops-api-secret

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi