name: CI da API

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-test:
    name: Compilar, testar e criar imagem
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Instalar o .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore DevOpsLab.slnx

      - name: Compilar aplicação
        run: >
          dotnet build DevOpsLab.slnx
          --configuration Release
          --no-restore

      - name: Executar testes
        run: >
          dotnet test DevOpsLab.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults

      - name: Construir imagem Docker
        run: |
          docker build \
            --tag devops-api:latest \
            --tag devops-api:${{ github.sha }} \
            .

      - name: Exibir imagem criada
        run: docker images devops-api