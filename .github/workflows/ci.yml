name: CI da API

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Compilar, testar e publicar imagem
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Instalar o .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore DevOpsLab.slnx

      - name: Compilar aplicação
        run: >
          dotnet build DevOpsLab.slnx
          --configuration Release
          --no-restore

      - name: Executar testes
        run: >
          dotnet test DevOpsLab.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/joaohlemes/devops-api:latest
            ghcr.io/joaohlemes/devops-api:${{ github.sha }}
  deploy-local:
    name: Deploy manual no Minikube
    needs: build-and-test

    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - Windows
      - X64
      - minikube

    steps:
      - name: Verificar cluster
        shell: powershell
        run: |
          minikube status
          minikube kubectl -- get nodes

      - name: Registrar causa do deploy
        shell: powershell
        run: |
          minikube kubectl -- annotate `
            deployment/devops-api `
            "kubernetes.io/change-cause=GitHub Actions commit ${{ github.sha }}" `
            --namespace=devops-lab `
            --overwrite

      - name: Atualizar imagem do Deployment
        shell: powershell
        run: |
          minikube kubectl -- set image `
            deployment/devops-api `
            devops-api=ghcr.io/joaohlemes/devops-api:${{ github.sha }} `
            --namespace=devops-lab

      - name: Aguardar Rolling Update
        id: rollout
        continue-on-error: true
        shell: powershell
        run: |
          minikube kubectl -- rollout status `
            deployment/devops-api `
            --namespace=devops-lab `
            --timeout=180s

      - name: Executar rollback em caso de falha
        if: steps.rollout.outcome == 'failure'
        shell: powershell
        run: |
          minikube kubectl -- rollout undo `
            deployment/devops-api `
            --namespace=devops-lab

          minikube kubectl -- rollout status `
            deployment/devops-api `
            --namespace=devops-lab `
            --timeout=180s

      - name: Marcar pipeline como reprovado
        if: steps.rollout.outcome == 'failure'
        shell: powershell
        run: |
          throw "O deploy falhou e o rollback foi executado."

      - name: Exibir versão implantada
        shell: powershell
        run: |
          minikube kubectl -- get deployment devops-api `
            --namespace=devops-lab `
            --output=jsonpath="{.spec.template.spec.containers[0].image}"