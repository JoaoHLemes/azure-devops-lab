name: CI da API

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Compilar e testar
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Instalar o .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore DevOpsLab.slnx

      - name: Compilar aplicação
        run: >
          dotnet build DevOpsLab.slnx
          --configuration Release
          --no-restore

      - name: Executar testes
        run: >
          dotnet test DevOpsLab.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults