name: CI da API

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Compilar, testar e publicar imagem
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Instalar o .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore DevOpsLab.slnx

      - name: Compilar aplicação
        run: >
          dotnet build DevOpsLab.slnx
          --configuration Release
          --no-restore

      - name: Executar testes
        run: >
          dotnet test DevOpsLab.slnx
          --configuration Release
          --no-build
          --logger trx
          --results-directory TestResults

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/joaohlemes/devops-api:latest
            ghcr.io/joaohlemes/devops-api:${{ github.sha }}